  <body>
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <canvas id="bubble-canvas" aria-hidden="true"></canvas>

    <div data-include="partials/navbar.html"></div>

    <main class="shop-main" id="main-content" tabindex="-1">
      <section class="section shop-hero reveal">
        <p class="eyebrow">Fausse boutique intégrée</p>
        <h1>Six savons extravagants, bio et faits main.</h1>
        <p class="lead">
          Découvrez notre collection de savons artisanaux biologiques, fabriqués
          avec soin à partir d’ingrédients naturels sélectionnés pour leur
          qualité et leurs bienfaits.
        </p>
      </section>
      <section
        class="shop-grid"
        id="shopGrid"
        aria-label="Collection de savons"
      >
        <noscript
          >Active JavaScript pour afficher les produits de
          démonstration.</noscript
        >
      </section>
      <div class="shop-toggle-wrap">
        <button
          class="btn primary shop-toggle"
          id="shopToggle"
          type="button"
          aria-controls="shopGrid"
          aria-expanded="false"
        >
          Afficher les 3 autres savons
        </button>
      </div>
    </main>

    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      aria-hidden="true"
    >
      <div class="modal-content">
        <button
          class="modal-close"
          id="modalClose"
          type="button"
          aria-label="Fermer la fenêtre"
        >
          ×
        </button>
        <div id="modalBody"></div>
      </div>
    </div>

    <div data-include="partials/footer.html"></div>

    <script src="assets/scripts/includes.js"></script>
    <script src="assets/scripts/app.js"></script>
    <!-- RZU-Informatique -->
  </body>
